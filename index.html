<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>32x32 Drag Pixel Drawer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="controls">
    <label>Width <input id="width" type="number" value="32"></label>
    <label>Height <input id="height" type="number" value="32"></label>
    <button id="export">Export</button>
    <button id="clear">Clear</button>
  </div>
  
  <label>
    Output
    <textarea id="jsonOutput" style="margin-left:8px; margin-right: 8px; width:400px; height:150px;"></textarea>
    <button id="copyOutput" type="button">Copy</button>
  </label>
  

  <div class="grid" id="grid"></div>

  <script src="index.js"></script>
</body>
</html>
