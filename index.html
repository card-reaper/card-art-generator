<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Card Reaper Custom Art Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav><a href="https://card-reaper.com/">Card-reaper.com</a></nav>
  <h1>Card Reaper Custom Art Studio</h1>
  <div class="controls">
    <label>Width <input id="width" type="number" value="32"></label>
    <label>Height <input id="height" type="number" value="32"></label>
    <button id="export">Export</button>
    <button id="clear">Clear</button>
    <label class="switch">
      <span class="switch-label">Grid</span>
      <input type="checkbox" id="toggleGrid" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <label>
    Output
    <textarea id="jsonOutput" style="margin-left:8px; margin-right: 8px; width:400px; height:150px;"></textarea>
    <button id="copyOutput" type="button">Copy</button>
  </label>
  

  <div class="grid" id="grid"></div>

  <div>
    <h1>Instructions</h1>
    <p>
      Click and drag to draw, right-click and drag to erase. Change width and height to desired. Once you're happy with your picture, click export and copy the json string for your card.
    </p>
  </div>

  <script src="index.js"></script>
</body>
</html>
